<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Shop Details • EngineX</title>
<link rel="shortcut icon" href="/static/img/favicon.png" type="image/x-icon">
<link rel="stylesheet" href="/static/css/style.css">

<style>
.container-shop {
    width: 60%;
    margin: 80px auto;
    background: rgba(255,255,255,0.05);
    padding: 40px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.15);
}

.shop-title {
    font-size: 2rem;
    font-weight: 700;
    color: #00c2de;
    margin-bottom: 15px;
}

label {
    color: #fff;
    font-size: 1rem;
    margin-bottom: 6px;
    display: block;
}

input, textarea {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    margin-bottom: 15px;
    background: rgba(255,255,255,0.08);
    color: white;
}

textarea {
    height: 100px;
    resize: none;
}

.upload-box {
    padding: 12px;
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    margin-bottom: 15px;
}

button {
    background: linear-gradient(135deg, #00c2de, #00eaff);
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    font-size: 1.1rem;
    font-weight: 700;
    color: black;
    cursor: pointer;
}

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 20px rgba(0,194,222,0.3);
}

.success-msg, .error-msg {
    display: none;
    font-size: 0.9rem;
    margin-bottom: 10px;
}
.success-msg { color: #22c55e; }
.error-msg { color: #ff6b6b; }

.header-bar {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 32px;
}
</style>
</head>

<body>

<header class="header" id="header">
<nav class="nav container header-bar">
<a href="/" class="nav__logo" style="display:flex; align-items:center; font-size:1.7rem; font-weight:700; color:white;">
    <img src="/static/img/favicon.png" style="width:32px; margin-right:10px;">
    EngineX
</a>
<span id="welcomeUser" style="color:#ffffff; font-size:1.1rem; font-weight:500;">
    Welcome, <span style="color:#00c2de;">User</span>
</span>
</nav>
</header>

<div class="container-shop">
<h2 class="shop-title">Add Shop Details</h2>

<p id="success" class="success-msg"></p>
<p id="error" class="error-msg"></p>

<label>Shop Name</label>
<input id="shop_name" type="text">

<label>Address</label>
<input id="address" type="text">

<label>City</label>
<input id="city" type="text">

<label>Phone</label>
<input id="phone" type="text">

<label>Description</label>
<textarea id="description"></textarea>

<label>Upload Shop Logo</label>
<input id="logo" type="file" accept="image/*" class="upload-box">

<button onclick="saveShop()">Save Shop Details</button>
</div>


<script>
document.addEventListener("DOMContentLoaded", () => {
    let user = JSON.parse(localStorage.getItem("enginex_user"));
    if (user) {
        document.getElementById("welcomeUser").innerHTML = 
        `Welcome, <span style='color:#00c2de;'>${user.username}</span>`;
    }
});

function saveShop() {
    let user = JSON.parse(localStorage.getItem("enginex_user"));

    let formData = new FormData();
    formData.append("owner_id", user.id);
    formData.append("shop_name", document.getElementById("shop_name").value);
    formData.append("address", document.getElementById("address").value);
    formData.append("city", document.getElementById("city").value);
    formData.append("phone", document.getElementById("phone").value);
    formData.append("description", document.getElementById("description").value);

    let file = document.getElementById("logo").files[0];
    if (file) formData.append("logo", file);

    fetch("/api/shop/create", {
        method: "POST",
        body: formData
    })
    .then(res => res.json())
    .then(res => {
        if(res.success){
            success.innerText = "Shop saved successfully! Redirecting...";
            success.style.display = "block";
            setTimeout(() => window.location.href = "/shop/dashboard", 700);
        } else {
            error.innerText = res.message;
            error.style.display = "block";
        }
    });
}


</script>

</body>
</html>
