<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/static/img/favicon.png">
<title>EngineX • Shop Dashboard</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>
/* header fixed + hide on scroll */
.header { position: fixed; top:0; left:0; right:0; z-index:999; transition: top .35s;}
.container { max-width:1100px; margin:0 auto; padding:0 20px; }
.dashboard-container { padding: 40px 0; }
.dashboard-title { font-size:2rem; color:#fff; margin:12px 0 20px; }
.dashboard-grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(260px,1fr)); gap:22px; }
.dash-card { background:#111; border-radius:16px; padding:22px; border:1px solid #222; cursor:pointer; }
.dash-title { color:#00eaff; font-weight:700; margin-bottom:8px; }
.dash-desc { color:#ccc; font-size:.95rem; }

/* Shop info */
#shopInfo { background:#111; border:1px solid #222; border-radius:12px; padding:20px; margin-top:24px; display:none; }
.shop-row { display:flex; gap:20px; align-items:flex-start; }
.shop-left { flex:1; color:#fff; }
.shop-right { width:260px; }
.shop-right img { width:100%; border-radius:10px; object-fit:cover; height:160px; }

/* services grid */
#servicesList { margin-top:30px; display:none; }
#servicesContainer { display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap:16px; margin-top:12px; }
.service-card { background:#111; border:1px solid #222; padding:12px; border-radius:10px; color:#fff; position:relative; }
.service-card h4 { color:#00eaff; margin:6px 0; }
.service-card p.price { color:#22e622; font-weight:700; margin:4px 0; }
.btn-row { display:flex; gap:8px; margin-top:10px; }
.btn { padding:8px 10px; border-radius:8px; border:none; cursor:pointer; font-weight:600; }
.edit-btn { background:#00c2de; color:#000; }
.del-btn { background:#ff3b3b; color:#fff; }

/* modal */
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; z-index:2000; }
.modal-inner { width:720px; max-width:94%; background:#0f0f10; padding:20px; border-radius:12px; border:1px solid #222; color:#fff; }
.row { display:flex; gap:12px; }
.form-group { margin-bottom:10px; }
.input, textarea { width:100%; padding:10px; border-radius:8px; border:none; background:#111; color:#fff; }
.modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:12px; }
.save-btn { background:linear-gradient(135deg,#00c2de,#00eaff); border:none; padding:10px 14px; border-radius:10px; font-weight:700; cursor:pointer; color:#000; }
.cancel-btn { background:#444; color:#fff; border:none; padding:10px 12px; border-radius:10px; cursor:pointer; }

/* responsive */
@media (max-width:720px){ .shop-row{flex-direction:column;} .shop-right{width:100%} }
</style>
</head>
<body style="background:#070707; color:#fff; font-family:Segoe UI, sans-serif;">

<header class="header" id="header" style="background:rgba(10,10,10,0.9); backdrop-filter:blur(6px);">
  <div class="container" style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;">
    <a href="/" style="display:flex;align-items:center;color:#fff;text-decoration:none;font-weight:700;">
      <img src="/static/img/favicon.png" style="width:30px;margin-right:10px;"> EngineX
    </a>
    <div id="welcomeUser" style="color:#fff">Welcome, <span style="color:#00c2de">User</span></div>
  </div>
</header>

<div class="container dashboard-container" style="margin-top:78px;">
  <h2 class="dashboard-title">Shop Dashboard</h2>

  <div class="dashboard-grid">
    <div class="dash-card" onclick="location.href='/shop/create'">
      <div class="dash-title">Add / Update Shop Details</div>
      <div class="dash-desc">Upload logo, address, phone and description.</div>
    </div>
    <div class="dash-card" onclick="location.href='/shop/services'">
      <div class="dash-title">Add Services</div>
      <div class="dash-desc">Add service items & images (ECU, Alloys, Spoiler etc.)</div>
    </div>
    <div class="dash-card" onclick="location.href='/shop/bookings'">
      <div class="dash-title">Bookings</div>
      <div class="dash-desc">View and manage bookings.</div>
    </div>
  </div>

  <!-- shop info -->
  <div id="shopInfo">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h3 style="color:#00eaff;margin:0">Shop Details</h3>
    </div>

    <div class="shop-row" style="margin-top:12px;">
      <div class="shop-left">
        <p id="shopName" style="font-weight:700;margin:6px 0;"></p>
        <p id="shopAddress" style="margin:6px 0;color:#ccc"></p>
        <p id="shopCity" style="margin:6px 0;color:#ccc"></p>
        <p id="shopPhone" style="margin:6px 0;color:#ccc"></p>
        <p id="shopDesc" style="margin:10px 0;color:#ddd"></p>
        <button onclick="location.href='/shop/create'" class="btn" style="background:linear-gradient(135deg,#00c2de,#00eaff);color:#000">Update Details</button>
      </div>
      <div class="shop-right">
        <img id="shopLogo" src="" alt="logo" style="display:none;">
      </div>
    </div>
  </div>

  <!-- services -->
  <div id="servicesList">
    <h3 style="color:#00eaff">Services</h3>
    <div id="servicesContainer"></div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal" id="editModal">
  <div class="modal-inner">
    <h3 id="modalTitle">Edit Service</h3>

    <div class="form-group">
      <label style="color:#ccc">Service Name</label>
      <input id="modal_name" class="input" placeholder="ECU / Alloys / Spoiler">
    </div>

    <div class="form-group">
      <label style="color:#ccc">Price (₹)</label>
      <input id="modal_price" class="input" type="number" placeholder="Price">
    </div>

    <div class="form-group">
      <label style="color:#ccc">Description</label>
      <textarea id="modal_desc" class="input" rows="4" placeholder="Description"></textarea>
    </div>

    <div class="form-group">
      <label style="color:#ccc">Replace Images (optional)</label>
      <input id="modal_images" type="file" accept="image/*" multiple>
      <div id="modal_preview" style="display:flex;gap:8px;margin-top:8px;"></div>
    </div>

    <div class="modal-actions">
      <button class="cancel-btn" onclick="closeModal()">Cancel</button>
      <button class="save-btn" onclick="saveModal()">Save</button>
    </div>
  </div>
</div>

<script>
// helper refs
const channel = new BroadcastChannel('enginex');
let currentUser = JSON.parse(localStorage.getItem('enginex_user') || 'null');

function showToast(msg){ alert(msg); }

// update dashboard UI with shop & services
function renderShopAndServices(shop) {
  if(!shop) return;
  document.getElementById('shopInfo').style.display = 'block';
  document.getElementById('shopName').innerText = "Shop: " + (shop.shop_name || '');
  document.getElementById('shopAddress').innerText = "Address: " + (shop.address || '');
  document.getElementById('shopCity').innerText = "City: " + (shop.city || '');
  document.getElementById('shopPhone').innerText = "Phone: " + (shop.phone || '');
  document.getElementById('shopDesc').innerText = shop.description || '';
  if (shop.logo) {
    const logo = document.getElementById('shopLogo');
    logo.src = `/static/uploads/${shop.logo}`;
    logo.style.display = 'block';
  }
  // services
  let services = [];
  try { services = JSON.parse(shop.accessories_data || "[]"); } catch(e){ services = []; console.error(e); }
  const cont = document.getElementById('servicesContainer');
  if (services.length === 0) {
    document.getElementById('servicesList').style.display = 'none';
    cont.innerHTML = '';
    return;
  }
  document.getElementById('servicesList').style.display = 'block';
  let html = '';
  services.forEach((s, idx) => {
    html += `
      <div class="service-card" data-index="${idx}">
        <h4>${escapeHtml(s.name)}</h4>
        <p class="price">₹${escapeHtml(s.price || '')}</p>
        <p style="color:#ccc">${escapeHtml(s.description || '')}</p>
        ${s.images && s.images.length ? `<img src="/static/uploads/${s.images[0]}" style="margin-top:8px; border-radius:8px;">` : ''}
        <div class="btn-row">
          <button class="btn edit-btn" onclick="openEdit(${idx})">Edit</button>
          <button class="btn del-btn" onclick="doDelete(${idx})">Delete</button>
        </div>
      </div>
    `;
  });
  cont.innerHTML = html;
}

function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});
}

// initial load
document.addEventListener('DOMContentLoaded', () => {
  if(!currentUser) {
    console.error('No user in localStorage'); return;
  }
  document.getElementById('welcomeUser').innerHTML = `Welcome, <span style="color:#00c2de">${currentUser.username}</span>`;
  fetch(`/api/shop/details/${currentUser.id}`).then(r=>r.json()).then(res=>{
    if(res.success) renderShopAndServices(res.shop);
  }).catch(e=>console.error(e));
});

// Broadcast channel listener -> update UI in real-time
channel.onmessage = (ev) => {
  const data = ev.data;
  if(data?.type === 'services-updated') {
    // server gave updated service list or shop; we can re-render using the shop model passed
    if (data.shop) renderShopAndServices(data.shop);
    else if (data.services) {
      // minimal update: update only servicesContainer
      // fetch shop details again to keep consistent
      if (currentUser) fetch(`/api/shop/details/${currentUser.id}`).then(r=>r.json()).then(res=>{ if(res.success) renderShopAndServices(res.shop); });
    }
  }
};

// DELETE
function doDelete(index){
  if(!confirm('Delete this service?')) return;
  if(!currentUser) return showToast('Login required');
  fetch(`/api/shop/services/delete/${currentUser.id}/${index}`, { method:'DELETE' })
    .then(r=>r.json())
    .then(res=>{
      if(res.success){
        // update UI: use returned services or re-fetch
        if(res.services){
          // re-render with returned array by wrapping into shop object
          const shop = { accessories_data: JSON.stringify(res.services), shop_name: document.getElementById('shopName').innerText.replace('Shop: ','') };
          renderShopAndServices(shop);
        } else {
          fetch(`/api/shop/details/${currentUser.id}`).then(r=>r.json()).then(res2=>{ if(res2.success) renderShopAndServices(res2.shop); });
        }
        // broadcast to other pages
        channel.postMessage({ type:'services-updated', services: res.services });
      } else showToast(res.message || 'Delete failed');
    }).catch(e=>{ console.error(e); showToast('Server error') });
}

/* ---------------------------
   EDIT Modal logic
   --------------------------- */
let editingIndex = null;
const modal = document.getElementById('editModal');
const modalName = document.getElementById('modal_name');
const modalPrice = document.getElementById('modal_price');
const modalDesc = document.getElementById('modal_desc');
const modalImages = document.getElementById('modal_images');
const modalPreview = document.getElementById('modal_preview');

function openEdit(index){
  editingIndex = index;
  // load current service values
  if(!currentUser) return;
  fetch(`/api/shop/details/${currentUser.id}`).then(r=>r.json()).then(res=>{
    if(!res.success) return showToast('Shop not found');
    const services = JSON.parse(res.shop.accessories_data||"[]");
    const s = services[index];
    if(!s) return showToast('Service not found');
    modalName.value = s.name || '';
    modalPrice.value = s.price || '';
    modalDesc.value = s.description || '';
    modalPreview.innerHTML = '';
    (s.images||[]).slice(0,4).forEach(src=>{
      const img = document.createElement('img');
      img.src = `/static/uploads/${src}`;
      img.style.width = '80px';
      img.style.borderRadius = '8px';
      modalPreview.appendChild(img);
    });
    modal.style.display = 'flex';
  }).catch(e=>console.error(e));
}

modalImages.addEventListener('change', (ev)=>{
  modalPreview.innerHTML = '';
  [...ev.target.files].forEach(f=>{
    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    img.style.width = '80px'; img.style.borderRadius = '8px';
    modalPreview.appendChild(img);
  });
});

function closeModal(){ editingIndex = null; modal.style.display = 'none'; modalImages.value = ''; modalPreview.innerHTML = ''; }

function saveModal(){
  if(editingIndex === null) return closeModal();
  if(!currentUser) return showToast('Login required');
  const fd = new FormData();
  fd.append('service_name', modalName.value.trim());
  fd.append('price', modalPrice.value);
  fd.append('description', modalDesc.value);
  const files = modalImages.files;
  for(let i=0;i<files.length;i++) fd.append('images', files[i]);

  fetch(`/api/shop/services/update/${currentUser.id}/${editingIndex}`, { method:'POST', body: fd })
    .then(r=>r.json())
    .then(res=>{
      if(res.success){
        // update UI using returned services
        if(res.services){
          const shop = { accessories_data: JSON.stringify(res.services), shop_name: document.getElementById('shopName').innerText.replace('Shop: ','') };
          renderShopAndServices(shop);
        } else {
          fetch(`/api/shop/details/${currentUser.id}`).then(r=>r.json()).then(res2=>{ if(res2.success) renderShopAndServices(res2.shop); });
        }
        channel.postMessage({ type:'services-updated', services: res.services });
        closeModal();
        showToast('Service updated');
      } else {
        showToast(res.message || 'Update failed');
      }
    }).catch(e=>{ console.error(e); showToast('Server error') });
}

// hide modal on backdrop click
modal.addEventListener('click', (ev)=>{ if(ev.target === modal) closeModal(); });

// header hide/show on scroll
let lastScroll = 0;
window.addEventListener('scroll', ()=> {
  const header = document.getElementById('header');
  const cur = window.pageYOffset;
  if(cur > lastScroll && cur > 80) header.style.top = '-88px';
  else header.style.top = '0';
  lastScroll = cur;
});
</script>
</body>
</html>
