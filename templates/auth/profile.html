<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EngineX • Profile</title>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="shortcut icon" href="/static/img/favicon.png" type="image/x-icon">

<style>
.profile-container {
    width: 90%;
    max-width: 550px;
    margin: 110px auto;
    background: rgba(255,255,255,0.06);
    padding: 32px;
    border-radius: 18px;
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.15);
    text-align: center;
}

.profile-pic-box {
    position: relative;
    width: 130px;
    height: 130px;
    margin: 0 auto 15px;
}

.profile-pic-box img {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #00c2de;
}

.edit-icon {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: #00c2de;
    color: black;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 18px;
    cursor:pointer;
    border: 2px solid black;
}

input[type="file"] { display: none; }

.profile-title {
    font-size: 1.8rem;
    font-weight: 700;
    color:white;
    margin-bottom: 6px;
}

.profile-sub {
    font-size: 1rem;
    color:#bbb;
    margin-bottom: 20px;
}

.profile-info {
    background: rgba(255,255,255,0.08);
    padding: 15px;
    border-radius: 12px;
    text-align:left;
    font-size:1rem;
    color:white;
}

.profile-info p { margin: 5px 0; }

.button-edit {
    margin-top: 18px;
    background: linear-gradient(135deg, #00c2de, #00eaff);
    color:black;
    font-size:1rem;
    padding:12px 22px;
    font-weight:700;
    border:none;
    border-radius:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="profile-container">

    <!-- PROFILE IMAGE -->
    <div class="profile-pic-box">
        <img id="profileImg" src="/static/img/default-user.jpg" alt="profile">
        <label for="imageUpload" class="edit-icon">✏️</label>
        <input type="file" id="imageUpload" accept="image/*">
    </div>

    <h2 class="profile-title" id="pUsername">User Name</h2>
    <p class="profile-sub" id="pRole">Customer</p>

    <div class="profile-info">

        <p><strong>Email:</strong> 
            <span id="pEmail"></span>
        </p>

        <p><strong>Phone:</strong> 
            <span id="pPhoneText"></span>
            <input type="text" id="pPhoneInput"
                   style="display:none; width:100%; margin-top:5px; padding:8px;">
        </p>

    </div>

    <!-- BUTTONS -->
    <button id="editBtn" class="button-edit">Edit Profile</button>
    <button id="saveBtn" class="button-edit" style="display:none; background:#22c55e;">
        Save Changes
    </button>

</div>



<script>
/* ================= LOAD PROFILE DATA ================= */
document.addEventListener("DOMContentLoaded", () => {
    let user = JSON.parse(localStorage.getItem("enginex_user")) || {};

    document.getElementById("pUsername").innerText = user.username || "User";
    document.getElementById("pEmail").innerText = user.email || "Not added";
    document.getElementById("pPhoneText").innerText = user.phone || "Not added";
    document.getElementById("pRole").innerText =
        user.role === "shopkeeper" ? "Shopkeeper" : "Customer";

    if (user.profile_pic) {
        document.getElementById("profileImg").src = user.profile_pic;
    }
});


/* ================= EDIT MODE ENABLE ================= */
document.getElementById("editBtn").addEventListener("click", () => {
    document.getElementById("editBtn").style.display = "none";
    document.getElementById("saveBtn").style.display = "block";

    document.getElementById("pPhoneText").style.display = "none";
    document.getElementById("pPhoneInput").style.display = "block";

    document.getElementById("pPhoneInput").value =
        document.getElementById("pPhoneText").innerText;
});

/* ================= SAVE CHANGES ================= */
document.getElementById("saveBtn").addEventListener("click", () => {
    let newPhone = document.getElementById("pPhoneInput").value;

    let user = JSON.parse(localStorage.getItem("enginex_user"));
    user.phone = newPhone;

    localStorage.setItem("enginex_user", JSON.stringify(user));

    // Update UI
    document.getElementById("pPhoneText").innerText = newPhone;
    document.getElementById("pPhoneText").style.display = "block";
    document.getElementById("pPhoneInput").style.display = "none";

    document.getElementById("editBtn").style.display = "block";
    document.getElementById("saveBtn").style.display = "none";

    alert("Profile updated successfully!");

    /* ================= REDIRECT AFTER SAVE ================= */
    setTimeout(() => {
        window.location.href = "/";
    }, 800);
});


/* ================= PROFILE IMAGE UPLOAD ================= */
document.getElementById("imageUpload").addEventListener("change", async function(){
    let file = this.files[0];
    let user = JSON.parse(localStorage.getItem("enginex_user"));

    // Preview
    const reader = new FileReader();
    reader.onload = e => {
        document.getElementById("profileImg").src = e.target.result;
    };
    reader.readAsDataURL(file);

    let formData = new FormData();
    formData.append("user_id", user.id);
    formData.append("profile_pic", file);

    let res = await fetch("/api/profile/upload", {
        method: "POST",
        body: formData
    });

    let data = await res.json();

    if (data.success) {
        user.profile_pic = data.profile_pic;


        // SAVE & SYNC EVERYWHERE
        localStorage.setItem("enginex_user", JSON.stringify(user));
        window.dispatchEvent(new Event("storage"));  // 🔥 NAVBAR AUTO UPDATE

        alert("Profile picture updated!");
    } else {
        alert("Upload failed!");
    }
});


</script>

</body>
</html>
